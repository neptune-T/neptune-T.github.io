name: Deploy Next.js site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: 'npm'

      - name: Setup Pages
        uses: actions/configure-pages@v5
        # next.config.ts owns static export, basePath and trailingSlash.
        # Automatic injection only detects JS configs and would create a competing next.config.js.
          
      - name: Install dependencies
        run: npm install --legacy-peer-deps
        
      - name: Build
        run: npm run build
        env:
          # This user site is hosted at the origin root. An `&& '' || ...`
          # expression always falls through and incorrectly adds the repo name.
          NEXT_PUBLIC_BASE_PATH: ''

      - name: Disable Jekyll (allow _next/)
        run: touch ./out/.nojekyll

      - name: Verify exported routes and asset URLs
        run: node scripts/verify-export.mjs
          
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out
          
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
